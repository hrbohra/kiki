# Render Blueprint for the Kiki API (NestJS + Prisma + tRPC, with WebSockets).
# A long-lived Node web service — keeps real-time messaging working (unlike serverless).
# Secrets (sync: false) are set in the Render dashboard, not committed.
services:
  - type: web
    name: kiki-api
    runtime: node
    plan: free
    # corepack activates the pinned pnpm; turbo builds @kiki/domain + @kiki/voice + the API;
    # migrate deploy applies any pending migrations to Neon (idempotent).
    # --prod=false forces dev deps (turbo, tsc, tsup, prisma) to install even though NODE_ENV=production.
    buildCommand: npm install -g pnpm@9.15.9 && pnpm install --frozen-lockfile --prod=false && pnpm build && pnpm --filter @kiki/api exec prisma migrate deploy
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
