name: Keep API warm

# Render's free web service spins down after ~15 min idle (first request then cold-starts ~30–50s).
# This pings /health every ~10 min so the demo stays instant. Free: GitHub-hosted, and 24/7 uptime
# stays within Render's free 750 instance-hours/month for a single service.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://kiki-api.onrender.com/health; then
              echo "\nwarm"; exit 0
            fi
            echo "retry $i…"; sleep 20
          done
          echo "ping failed (non-fatal)"; exit 0
